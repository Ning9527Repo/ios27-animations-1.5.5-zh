name: iOS 27 Animations + Keyboard Glass + Theseus Switch 0.3 RootHide
on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [build-once]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Merge settings groups and keyboard switch
        run: python3 tools/merge-settings-groups.py
      - name: Validate complete source and Chinese strings
        env:
          PACKAGE_SCHEME: roothide
          PACKAGE_ARCH: iphoneos-arm64e
          PACKAGE_VERSION: 0.3.3
          EXPECTED_ARCHS: arm64e
        run: |
          python3 tests/check-localization.py
          python3 tests/check-package-identity.py
          python3 tests/check-settings-pages.py
          python3 tests/check-settings-appearance.py
          python3 tests/check-liquid-switch-integration.py
          python3 tests/check-qq-switch.py
          python3 tests/check-switch-configuration.py
          python3 tests/keyboardglass_test_glass_edges.py
          python3 tests/keyboardglass_test_candidate_controls.py
          python3 tests/keyboardglass_test_candidate_highlight.py
          python3 tests/keyboardglass_test_material_blur.py
          python3 tests/keyboardglass_test_global_preferences.py
          python3 tests/keyboardglass_test_settings_cache.py
          python3 iOS27Animations/SwitchFeature/tests/geometry-policy.py
          python3 iOS27Animations/SwitchFeature/tests/clock-replay-policy.py
          python3 iOS27Animations/SwitchFeature/tests/memory-cache-policy.py
          for test in motion reference_motion compact clock; do
            cc -std=c11 -O2 -Wall -Wextra -Werror "iOS27Animations/BannerFeature/tests/test_${test}.c" -lm -o "$RUNNER_TEMP/banner-${test}-test"
            "$RUNNER_TEMP/banner-${test}-test"
          done
      - name: Install native RootHide toolchain
        run: |
          brew install dpkg ldid xz
          git clone --recursive --depth 1 --shallow-submodules https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          cd "$RUNNER_TEMP/theos"
          git checkout 958fea4f779943505b15b93c88bb4db8d97b346d
          git submodule update --init --recursive --depth 1
          THEOS="$RUNNER_TEMP/theos" "$RUNNER_TEMP/theos/bin/install-sdk" latest
      - name: Compile integrated Theseus shader resource
        run: python3 tools/prepare-switch-resources.py "$RUNNER_TEMP/switch-resources"
      - name: Build real RootHide arm64e package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          make -C iOS27Animations stage FINALPACKAGE=1 TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS='--force --sign -'
          STAGE=$(find iOS27Animations/.theos -type d -path '*/Library/PreferenceBundles/iOS2627AnimsPrefs.bundle' -print -quit)
          DYLIB=$(find iOS27Animations/.theos -type f -path '*/Library/MobileSubstrate/DynamicLibraries/iOS2627Anims.dylib' -print -quit)
          test -n "$STAGE" && test -n "$DYLIB"
          STAGE_ROOT="${STAGE%/Library/PreferenceBundles/iOS2627AnimsPrefs.bundle}"
          RESOURCE_ROOT="$STAGE_ROOT/Library/Application Support/iOS27Animations"
          mkdir -p "$RESOURCE_ROOT" "$STAGE_ROOT/usr/share/doc/com.ning.ios2627anims/Theseus"
          cp -R "$RUNNER_TEMP/switch-resources/TheseusSwitchResources.bundle" "$RESOURCE_ROOT/"
          cp iOS27Animations/SwitchFeature/LICENSE-Theseus "$STAGE_ROOT/usr/share/doc/com.ning.ios2627anims/Theseus/LICENSE"
          cp iOS27Animations/SwitchFeature/NOTICE-Theseus "$STAGE_ROOT/usr/share/doc/com.ning.ios2627anims/Theseus/NOTICE"
          cp iOS27Animations/SwitchFeature/Vendor/manifest.json "$STAGE_ROOT/usr/share/doc/com.ning.ios2627anims/Theseus/vendor-manifest.json"
          PREFS_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$STAGE/Info.plist")
          PREFS_BIN="$STAGE/$PREFS_EXEC"
          test -f "$PREFS_BIN"
          strip -x "$DYLIB"
          strip -x "$PREFS_BIN"
          codesign --force --deep --sign - "$STAGE"
          codesign --force --sign - "$DYLIB"
          make -C iOS27Animations before-package internal-package after-package PACKAGE_VERSION='0.3.3' TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS='--force --sign -'
      - name: Verify final deb and code signatures
        run: |
          for PACKAGE in iOS27Animations/packages/*.deb; do
            python3 tools/normalize-package-ownership.py "$PACKAGE" "$PACKAGE.normalized" > "$PACKAGE.ownership.json"
            mv "$PACKAGE.normalized" "$PACKAGE"
          done
          python3 tests/verify-roothide.py iOS27Animations/packages
          python3 tests/check-arm64e-metadata.py iOS27Animations/packages/*.deb
          EXPECTED_ARCHS=arm64e python3 tests/check-code-pages.py iOS27Animations/packages/*.deb
      - name: Upload package and verification
        uses: actions/upload-artifact@v4
        with:
          name: iOS27Animations-0.3.3-arm64e-roothide
          path: |
            iOS27Animations/packages/*.deb
            iOS27Animations/packages/*.json
          if-no-files-found: error
